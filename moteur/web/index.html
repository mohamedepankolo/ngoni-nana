<!doctype html>
<html lang="bm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>N'GONI NANA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#b85424">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #faf7f2;
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif; user-select: none;
  }

  /* ---------- Vue principale (utilisatrice) ---------- */
  /* Un seul element visible et interactif sur cet ecran : le gros bouton.
     Pas de logo, pas de point d'etat separe (la couleur du bouton suffit) :
     un deuxieme element qui ressemble a un micro ou a un bouton a cote du
     vrai bouton a cause une vraie confusion en test reel (2026-10-08). */
  #vuePrincipale {
    height: 100%; display: flex; flex-direction: column; align-items: center; padding: 24px; gap: 16px;
  }
  #zoneBouton { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; padding-top: 28px; }

  /* MODE TEST (2026-10-09) : fil des echanges affiche a l'ecran pour suivre
     ce qui est reconnu/repondu pendant les tests internes, sans avoir a
     ouvrir le reglage cache a chaque tour. A RETIRER avant un usage reel
     avec une utilisatrice : elle ne doit rien voir d'ecrit a l'ecran. Pour
     retirer : supprimer ce bloc de style, le <div id="filEchanges"> plus
     bas, et les 2 appels a ajouterAuFil(...) dans envoyerTour(). */
  #filEchanges {
    flex: 1 1 auto; width: 100%; max-width: 480px; overflow-y: auto;
    font-size: 13px; line-height: 1.4; color: #333;
  }
  #filEchanges .tour { margin-bottom: 10px; }
  #filEchanges strong { color: #b85424; }

  /* Zone invisible, coin haut-gauche : 5 appuis rapides ouvrent le reglage
     equipe. Remplace l'ancien logo visible (qui ressemblait a un micro). */
  #zoneReglageSecrete { position: absolute; top: 0; left: 0; width: 72px; height: 72px; }

  #bouton {
    width: 220px; height: 220px; border-radius: 50%; border: none;
    background: #b85424; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(184,84,36,0.35);
    transition: background-color 0.25s ease, transform 0.15s ease;
  }
  #bouton svg { width: 88px; height: 88px; }
  #bouton.enregistre {
    background: #c23b2e;
    animation: pouls 1.1s ease-in-out infinite;
  }
  #bouton.traitement { background: #c9892f; }
  #bouton.traitement svg { animation: tourne 1.2s linear infinite; }
  #bouton.parle { background: #4f8f5a; animation: pouls-doux 1.6s ease-in-out infinite; }
  /* Gris-bleu, deliberement hors de la palette chaude (pret/enregistre/
     traitement/parle sont tous orange-rouge-vert) : doit se distinguer d'un
     coup d'oeil de "enregistre" (rouge vif), pas juste par une nuance de
     rouge differente. Verifie par capture d'ecran comparant les 5 etats
     cote a cote (2026-10-08). */
  #bouton.erreur { background: #5c6670; animation: flash-erreur 0.5s ease-in-out 2; }
  #bouton:active { transform: scale(0.96); }
  #bouton:disabled { opacity: 0.55; }

  @keyframes pouls {
    0%, 100% { box-shadow: 0 0 0 0 rgba(194,59,46,0.45); }
    50% { box-shadow: 0 0 0 28px rgba(194,59,46,0); }
  }
  @keyframes flash-erreur {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }
  @keyframes pouls-doux {
    0%, 100% { box-shadow: 0 0 0 0 rgba(79,143,90,0.35); }
    50% { box-shadow: 0 0 0 20px rgba(79,143,90,0); }
  }
  @keyframes tourne { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  audio { display: none; }

  /* ---------- Vue réglage (staff uniquement, cachée) ---------- */
  #vueReglage {
    display: none; height: 100%; overflow-y: auto; padding: 24px; background: #faf7f2;
    font-size: 14px; color: #2a2a2a;
  }
  #vueReglage.visible { display: block; }
  #vueReglage h2 { font-size: 16px; }
  #vueReglage label { display: block; margin: 16px 0 6px; font-size: 13px; color: #666; }
  #vueReglage input[type=text] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
  #vueReglage button { margin-top: 16px; padding: 10px 16px; border-radius: 8px; border: none; background: #b85424; color: #fff; font-weight: 600; }
  #vueReglage .journal { margin-top: 20px; font-size: 12px; color: #555; white-space: pre-wrap; max-height: 40vh; overflow-y: auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; }
  #fermerReglage { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 20px; }
</style>
</head>
<body>

<div id="vuePrincipale">
  <div id="zoneReglageSecrete" onclick="gererTapLogo()"></div>

  <div id="zoneBouton">
    <button id="bouton" disabled>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="9" y="3" width="6" height="11" rx="3" fill="#fff"/>
        <path d="M6 11a6 6 0 0 0 12 0" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <line x1="12" y1="18" x2="12" y2="21" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- MODE TEST : voir le commentaire sur #filEchanges dans <style>. -->
  <div id="filEchanges"></div>
</div>

<div id="vueReglage">
  <button id="fermerReglage" onclick="fermerReglage()">×</button>
  <h2>Reglage (equipe)</h2>
  <label>Jeton API (API_TOKEN du serveur)</label>
  <input type="text" id="champJeton">
  <button onclick="enregistrerJeton()">Enregistrer et demarrer</button>
  <div class="journal" id="journalDebug"></div>
</div>

<audio id="lecteur"></audio>

<!-- Fourni par le serveur (voir api.py, /web/config.js) : window.NGONI_JETON.
     Evite d'avoir a taper le jeton a la main sur chaque appareil (geste
     cache 5 appuis en secours seulement, si ce script ne charge pas). -->
<script src="config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
// Priorite : un jeton saisi a la main (reglage equipe, pour pointer vers un
// autre serveur par ex.) > celui fourni automatiquement par ce serveur
// (config.js) > vide (jamais atteint en usage normal).
let jeton = localStorage.getItem("ngoni_jeton") || window.NGONI_JETON || "";
let utilisatriceId = null;
let sessionId = null;
let media = null, enregistreur = null, morceaux = [];
let compteurTapLogo = 0, minuteurTapLogo = null;

function journal(texte) {
  const j = $("journalDebug");
  j.textContent = `[${new Date().toLocaleTimeString()}] ${texte}\n` + j.textContent;
}

// MODE TEST : voir le commentaire sur #filEchanges dans <style>. A retirer
// avec le reste quand ce ne sera plus necessaire.
function ajouterAuFil(etiquette, texte) {
  const fil = $("filEchanges");
  const ligne = document.createElement("div");
  ligne.className = "tour";
  const gras = document.createElement("strong");
  gras.textContent = etiquette + " : ";
  ligne.appendChild(gras);
  ligne.appendChild(document.createTextNode(texte));
  fil.appendChild(ligne);
  fil.scrollTop = fil.scrollHeight;
}

function etatBouton(nom) {
  $("bouton").className = nom || "";
}

// Chemin de secours en cas d'echec (reseau, ASR, TTS, micro refuse...) :
// contrairement a journal() (ecran reglage cache, jamais vu par
// l'utilisatrice), ceci doit etre percu sans savoir lire : un son joue + le
// bouton flashe rouge brievement, puis revient a l'etat pret. Le clip audio
// est embarque dans l'app (assets/erreur.wav), donc disponible meme si le
// serveur ne repond plus du tout.
async function signalerErreur(texteJournal) {
  journal(texteJournal);
  if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
  etatBouton("erreur");
  try {
    const lecteur = $("lecteur");
    lecteur.src = "assets/erreur.wav";
    await new Promise((r) => { lecteur.onended = r; lecteur.play().catch(r); });
  } catch (e) { /* lecture best-effort : l'etat visuel suffit si le son echoue aussi */ }
  etatBouton("");
}

// 5 appuis rapides dans le coin haut-gauche (zone invisible) = ouvrir le
// reglage (geste reserve a l'equipe, improbable pour une utilisatrice qui ne
// cherche pas a l'activer).
function gererTapLogo() {
  compteurTapLogo++;
  clearTimeout(minuteurTapLogo);
  minuteurTapLogo = setTimeout(() => { compteurTapLogo = 0; }, 1500);
  if (compteurTapLogo >= 5) {
    compteurTapLogo = 0;
    $("champJeton").value = jeton;
    $("vueReglage").classList.add("visible");
  }
}
function fermerReglage() { $("vueReglage").classList.remove("visible"); }
function enregistrerJeton() {
  jeton = $("champJeton").value.trim();
  localStorage.setItem("ngoni_jeton", jeton);
  fermerReglage();
  demarrer();
}

// Marge large : un /call_audio reel enchaine conversion ffmpeg + ASR + TTS
// (Space Gradio distant), et le tout premier appel apres un redemarrage
// serveur sans prechauffage (NGONI_PREWARM, api.py) peut a lui seul prendre
// plusieurs secondes rien que pour charger le modele NeMo. Observe en test
// reel (2026-10-08) : 25s coupait avant que la vraie reponse n'arrive.
const DELAI_MAX_MS = 45000;

async function appelApi(chemin, options = {}) {
  const entetes = options.entetes || {};
  if (!(options.corps instanceof FormData)) entetes["Content-Type"] = "application/json";
  entetes["Authorization"] = "Bearer " + jeton;
  const controleur = new AbortController();
  const minuteur = setTimeout(() => controleur.abort(), DELAI_MAX_MS);
  let reponse;
  try {
    reponse = await fetch(chemin, {
      method: options.methode || "GET", headers: entetes,
      body: options.corps instanceof FormData ? options.corps : options.corps ? JSON.stringify(options.corps) : undefined,
      signal: controleur.signal,
    });
  } catch (e) {
    if (e.name === "AbortError") throw new Error("reseau trop lent, reessaie");
    throw e;
  } finally {
    clearTimeout(minuteur);
  }
  if (!reponse.ok) throw new Error(`${reponse.status} : ${await reponse.text()}`);
  return reponse.json();
}

async function demarrer() {
  if (!jeton) { journal("Aucun jeton enregistre."); return; }
  try {
    const bootstrap = await appelApi("/demo/bootstrap", { methode: "POST", corps: {} });
    utilisatriceId = bootstrap.utilisatrice_id;
    await nouvelleSession();
    journal("Pret.");
    $("bouton").disabled = false;
  } catch (e) {
    await signalerErreur("Erreur de connexion : " + e.message);
  }
}

async function nouvelleSession() {
  const s = await appelApi("/session", { methode: "POST", corps: { utilisatrice_id: utilisatriceId } });
  sessionId = s.session_id;
  journal("Session " + sessionId + " demarree.");
}

async function commencerEnregistrement() {
  if (!media) media = await navigator.mediaDevices.getUserMedia({ audio: true });
  morceaux = [];
  enregistreur = new MediaRecorder(media);
  enregistreur.ondataavailable = (e) => morceaux.push(e.data);
  enregistreur.start();
  if (navigator.vibrate) navigator.vibrate(30);
  etatBouton("enregistre");
}

function arreterEnregistrement() {
  return new Promise((resoudre) => {
    if (!enregistreur || enregistreur.state === "inactive") return resoudre(null);
    enregistreur.onstop = () => resoudre(new Blob(morceaux, { type: "audio/webm" }));
    enregistreur.stop();
  });
}

async function envoyerTour(blobAudio) {
  etatBouton("traitement");
  $("bouton").disabled = true;
  try {
    const donnees = new FormData();
    donnees.append("session_id", sessionId);
    donnees.append("utilisatrice_id", utilisatriceId);
    donnees.append("fichier", blobAudio, "tour.webm");
    const resultat = await appelApi("/call_audio", { methode: "POST", corps: donnees });

    journal(`reconnu: « ${resultat.texte_reconnu || "(rien)"} » -> ${resultat.message}`);
    ajouterAuFil("Toi", resultat.texte_reconnu || "(rien compris)");  // MODE TEST, voir #filEchanges
    ajouterAuFil("N'GONI NANA", resultat.message);                   // MODE TEST, voir #filEchanges

    if (resultat.audio_base64) {
      const lecteur = $("lecteur");
      lecteur.src = `data:audio/${resultat.type_audio};base64,${resultat.audio_base64}`;
      etatBouton("parle");
      await new Promise((r) => { lecteur.onended = r; lecteur.play().catch(r); });
    }

    if (resultat.action === "fin_session" || resultat.action === "escalade_humaine") {
      // "enregistrer" ne declenche plus une nouvelle session tout de suite :
      // le systeme demande d'abord "veux-tu faire autre chose ?" et attend
      // une vraie reponse (voir agent_vocal.py, _traiter_reponse_continuer).
      // Une nouvelle session ne demarre qu'une fois cet echange termine
      // (oui -> "continuer_session" reste sur la meme session ; non ->
      // "fin_session" ici). Avant ce correctif, la session changeait tout de
      // suite apres l'enregistrement et la reponse a la question etait
      // traitee comme une tentative d'action ratee (bug reel, 2026-10-09).
      await nouvelleSession();
    }
  } catch (e) {
    await signalerErreur("Erreur : " + e.message);
  } finally {
    etatBouton("");
    $("bouton").disabled = false;
  }
}

const bouton = $("bouton");
let enTraitement = false;
bouton.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  // L'attribut HTML "disabled" n'empeche pas toujours un pointerdown de se
  // declencher (observe en test reel, 2026-10-08 : bouton grise car demarrer()
  // n'avait pas encore reussi, mais le micro s'activait quand meme et l'envoi
  // echouait en 401 plus loin, au lieu de simplement ne rien faire).
  if (bouton.disabled || enTraitement) return;
  commencerEnregistrement().catch((err) => signalerErreur("Micro indisponible : " + err.message));
});
["pointerup", "pointerleave", "pointercancel"].forEach((evt) =>
  bouton.addEventListener(evt, async () => {
    if (!enregistreur || enregistreur.state !== "recording") return;
    // Desactive IMMEDIATEMENT, avant tout await : sinon un second
    // pointerdown entre ce relachement et l'envoi reel peut demarrer un
    // nouvel enregistrement qui ecrase `morceaux` en plein milieu.
    enTraitement = true;
    $("bouton").disabled = true;
    const blob = await arreterEnregistrement();
    if (blob && blob.size > 0) {
      await envoyerTour(blob);
    } else {
      etatBouton("");
      $("bouton").disabled = false;
    }
    enTraitement = false;
  })
);

if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  journal("Microphone indisponible (ouvrir cette page en https).");
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

if (jeton) demarrer();
else journal("Aucun jeton : ouvrir le reglage (5 appuis coin haut-gauche de l'ecran).");
</script>
</body>
</html>
