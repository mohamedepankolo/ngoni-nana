<!doctype html>
<html lang="bm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>N'GONI NANA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#b85424">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #faf7f2;
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif; user-select: none;
  }

  /* ---------- Vue principale (utilisatrice) ---------- */
  /* Un seul element visible et interactif sur cet ecran : le gros bouton.
     Pas de logo, pas de point d'etat separe (la couleur du bouton suffit) :
     un deuxieme element qui ressemble a un micro ou a un bouton a cote du
     vrai bouton a cause une vraie confusion en test reel (2026-10-08). */
  #vuePrincipale {
    height: 100%; display: flex; flex-direction: column; align-items: center; padding: 24px; gap: 16px;
  }
  #zoneBouton { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; padding-top: 28px; }

  /* MODE TEST (menu numerique, R2) : boutons 1-6 pour tester le menu sans
     repasser par le micro a chaque fois (plus rapide que d'enregistrer la
     voix pour chaque essai). A RETIRER avec le reste du MODE TEST avant un
     usage reel : le vrai canal est la voix/telephonie, pas des boutons a
     l'ecran (voir le commentaire sur #filEchanges, meme raison). */
  #menuNumerique {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 320px;
  }
  #menuNumerique button {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid #b85424;
    background: #fff; color: #b85424; font-size: 16px; font-weight: 600;
  }
  #menuNumerique button:disabled { opacity: 0.4; }

  /* MODE TEST : saisie clavier d'un champ precis (quantite/montant/article/
     client), affichee quand attente = "champ:<nom>" (voir agent_vocal.py,
     AgentVocal._attente). Clavier numerique pour quantite/montant, texte
     libre pour article/client (voir LABELS_CHAMP plus bas). */
  #champSaisie { display: none; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 280px; }
  #champSaisie input {
    width: 100%; padding: 14px; font-size: 20px; text-align: center;
    border: 2px solid #b85424; border-radius: 10px;
  }
  #champSaisie button {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: #b85424; color: #fff; font-weight: 600; font-size: 16px;
  }
  #champSaisie button:disabled, #choixOuiNon button:disabled { opacity: 0.4; }

  /* MODE TEST : choix oui/non (confirmation d'un champ tout juste saisi,
     confirmation globale de fin de transaction, ou "veux-tu faire autre
     chose ?" - memes 3 cas que attente dans agent_vocal.py). */
  #choixOuiNon { display: none; gap: 14px; }
  #choixOuiNon button {
    width: 72px; height: 72px; border-radius: 50%; border: none; font-size: 28px; color: #fff;
  }
  #choixOuiNon .oui { background: #4f8f5a; }
  #choixOuiNon .non { background: #c23b2e; }

  /* Bouton d'ouverture du bilan/resume - visible (contrairement au geste
     cache du reglage equipe) : partie explicitement demandee en plus du
     flux vocal, pas reservee a l'equipe. */
  #ouvrirBilanBouton {
    position: absolute; top: 16px; right: 16px; width: 40px; height: 40px;
    border-radius: 50%; border: 1px solid #b85424; background: #fff; color: #b85424;
    font-size: 18px; display: flex; align-items: center; justify-content: center;
  }

  /* MODE TEST (2026-10-09) : fil des echanges affiche a l'ecran pour suivre
     ce qui est reconnu/repondu pendant les tests internes, sans avoir a
     ouvrir le reglage cache a chaque tour. A RETIRER avant un usage reel
     avec une utilisatrice : elle ne doit rien voir d'ecrit a l'ecran. Pour
     retirer : supprimer ce bloc de style, le <div id="filEchanges"> plus
     bas, et les 2 appels a ajouterAuFil(...) dans envoyerTour(). */
  #filEchanges {
    flex: 1 1 auto; width: 100%; max-width: 480px; overflow-y: auto;
    font-size: 13px; line-height: 1.4; color: #333;
  }
  #filEchanges .tour { margin-bottom: 10px; }
  #filEchanges strong { color: #b85424; }

  /* Zone invisible, coin haut-gauche : 5 appuis rapides ouvrent le reglage
     equipe. Remplace l'ancien logo visible (qui ressemblait a un micro). */
  #zoneReglageSecrete { position: absolute; top: 0; left: 0; width: 72px; height: 72px; }

  #bouton {
    width: 220px; height: 220px; border-radius: 50%; border: none;
    background: #b85424; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(184,84,36,0.35);
    transition: background-color 0.25s ease, transform 0.15s ease;
  }
  #bouton svg { width: 88px; height: 88px; }
  #bouton.enregistre {
    background: #c23b2e;
    animation: pouls 1.1s ease-in-out infinite;
  }
  #bouton.traitement { background: #c9892f; }
  #bouton.traitement svg { animation: tourne 1.2s linear infinite; }
  #bouton.parle { background: #4f8f5a; animation: pouls-doux 1.6s ease-in-out infinite; }
  /* Gris-bleu, deliberement hors de la palette chaude (pret/enregistre/
     traitement/parle sont tous orange-rouge-vert) : doit se distinguer d'un
     coup d'oeil de "enregistre" (rouge vif), pas juste par une nuance de
     rouge differente. Verifie par capture d'ecran comparant les 5 etats
     cote a cote (2026-10-08). */
  #bouton.erreur { background: #5c6670; animation: flash-erreur 0.5s ease-in-out 2; }
  #bouton:active { transform: scale(0.96); }
  #bouton:disabled { opacity: 0.55; }

  @keyframes pouls {
    0%, 100% { box-shadow: 0 0 0 0 rgba(194,59,46,0.45); }
    50% { box-shadow: 0 0 0 28px rgba(194,59,46,0); }
  }
  @keyframes flash-erreur {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }
  @keyframes pouls-doux {
    0%, 100% { box-shadow: 0 0 0 0 rgba(79,143,90,0.35); }
    50% { box-shadow: 0 0 0 20px rgba(79,143,90,0); }
  }
  @keyframes tourne { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  audio { display: none; }

  /* ---------- Vue réglage (staff uniquement, cachée) ---------- */
  #vueReglage {
    display: none; height: 100%; overflow-y: auto; padding: 24px; background: #faf7f2;
    font-size: 14px; color: #2a2a2a;
  }
  #vueReglage.visible { display: block; }
  #vueReglage h2 { font-size: 16px; }
  #vueReglage label { display: block; margin: 16px 0 6px; font-size: 13px; color: #666; }
  #vueReglage input[type=text] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
  #vueReglage button { margin-top: 16px; padding: 10px 16px; border-radius: 8px; border: none; background: #b85424; color: #fff; font-weight: 600; }
  #vueReglage .journal { margin-top: 20px; font-size: 12px; color: #555; white-space: pre-wrap; max-height: 40vh; overflow-y: auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; }
  #fermerReglage { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 20px; }

  /* ---------- Vue bilan (résumé/dashboard - demande explicite, "une partie
     bilan/résumé" en plus du flux vocal) ---------- */
  #vueBilan {
    display: none; height: 100%; overflow-y: auto; padding: 24px 20px; background: #faf7f2;
    position: relative;
  }
  #vueBilan.visible { display: block; }
  #vueBilan h2 { font-size: 15px; color: #666; font-weight: 500; margin: 0 0 4px; }
  #vueBilan .gros-chiffre { font-size: 38px; font-weight: 700; color: #2a2a2a; margin: 0 0 20px; }
  #vueBilan .gros-chiffre.negatif { color: #c23b2e; }
  #vueBilan .carte {
    background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  #vueBilan .ligne { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
  #vueBilan .ligne + .ligne { border-top: 1px solid #f0ebe3; }
  #vueBilan .vente { color: #4f8f5a; }
  #vueBilan .depense { color: #c23b2e; }
  #fermerBilan { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 22px; }
</style>
</head>
<body>

<div id="vuePrincipale">
  <div id="zoneReglageSecrete" onclick="gererTapLogo()"></div>
  <button id="ouvrirBilanBouton" onclick="ouvrirBilan()" title="Bilan">&#9776;</button>

  <div id="zoneBouton">
    <button id="bouton" disabled>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="9" y="3" width="6" height="11" rx="3" fill="#fff"/>
        <path d="M6 11a6 6 0 0 0 12 0" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <line x1="12" y1="18" x2="12" y2="21" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- MODE TEST (menu numerique) : voir le commentaire sur #menuNumerique dans <style>. -->
  <div id="menuNumerique">
    <button disabled data-chiffre="1" onclick="envoyerChoixMenu(1)">1</button>
    <button disabled data-chiffre="2" onclick="envoyerChoixMenu(2)">2</button>
    <button disabled data-chiffre="3" onclick="envoyerChoixMenu(3)">3</button>
    <button disabled data-chiffre="4" onclick="envoyerChoixMenu(4)">4</button>
    <button disabled data-chiffre="5" onclick="envoyerChoixMenu(5)">5</button>
    <button disabled data-chiffre="6" onclick="envoyerChoixMenu(6)">6</button>
  </div>

  <!-- MODE TEST : saisie clavier d'un champ precis (voir #champSaisie dans <style>). -->
  <div id="champSaisie">
    <input id="champSaisieEntree" type="text">
    <button disabled onclick="envoyerChampSaisi()">Valider</button>
  </div>

  <!-- MODE TEST : choix oui/non (voir #choixOuiNon dans <style>). -->
  <div id="choixOuiNon">
    <button class="oui" disabled onclick="envoyerOuiNon(true)">&#10003;</button>
    <button class="non" disabled onclick="envoyerOuiNon(false)">&#10007;</button>
  </div>

  <!-- MODE TEST : voir le commentaire sur #filEchanges dans <style>. -->
  <div id="filEchanges"></div>
</div>

<div id="vueBilan">
  <button id="fermerBilan" onclick="fermerBilanVue()">×</button>
  <h2>Jagokun (capital)</h2>
  <div class="gros-chiffre" id="bilanCapital">—</div>
  <div class="carte">
    <div class="ligne"><span>Feereli (ventes)</span><span class="vente" id="bilanVentes">—</span></div>
    <div class="ligne"><span>Wariboli (dépenses)</span><span class="depense" id="bilanDepenses">—</span></div>
  </div>
  <div class="carte" id="bilanDettesCarte">
    <h2>Juru (dettes clients)</h2>
    <div id="bilanDettes"></div>
  </div>
  <div class="carte" id="bilanStockCarte">
    <h2>Bolo (stock)</h2>
    <div id="bilanStock"></div>
  </div>
  <div class="carte">
    <h2>Kɛwale laban (dernières transactions)</h2>
    <div id="bilanTransactions"></div>
  </div>
</div>

<div id="vueReglage">
  <button id="fermerReglage" onclick="fermerReglage()">×</button>
  <h2>Reglage (equipe)</h2>
  <label>Jeton API (API_TOKEN du serveur)</label>
  <input type="text" id="champJeton">
  <button onclick="enregistrerJeton()">Enregistrer et demarrer</button>
  <div class="journal" id="journalDebug"></div>
</div>

<audio id="lecteur"></audio>

<!-- Fourni par le serveur (voir api.py, /web/config.js) : window.NGONI_JETON.
     Evite d'avoir a taper le jeton a la main sur chaque appareil (geste
     cache 5 appuis en secours seulement, si ce script ne charge pas). -->
<script src="config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
// Priorite : un jeton saisi a la main (reglage equipe, pour pointer vers un
// autre serveur par ex.) > celui fourni automatiquement par ce serveur
// (config.js) > vide (jamais atteint en usage normal).
let jeton = localStorage.getItem("ngoni_jeton") || window.NGONI_JETON || "";
let utilisatriceId = null;
let sessionId = null;
let media = null, enregistreur = null, morceaux = [];
let compteurTapLogo = 0, minuteurTapLogo = null;

function journal(texte) {
  const j = $("journalDebug");
  j.textContent = `[${new Date().toLocaleTimeString()}] ${texte}\n` + j.textContent;
}

// MODE TEST : voir le commentaire sur #filEchanges dans <style>. A retirer
// avec le reste quand ce ne sera plus necessaire.
function ajouterAuFil(etiquette, texte) {
  const fil = $("filEchanges");
  const ligne = document.createElement("div");
  ligne.className = "tour";
  const gras = document.createElement("strong");
  gras.textContent = etiquette + " : ";
  ligne.appendChild(gras);
  ligne.appendChild(document.createTextNode(texte));
  fil.appendChild(ligne);
  fil.scrollTop = fil.scrollHeight;
}

function etatBouton(nom) {
  $("bouton").className = nom || "";
}

// Chemin de secours en cas d'echec (reseau, ASR, TTS, micro refuse...) :
// contrairement a journal() (ecran reglage cache, jamais vu par
// l'utilisatrice), ceci doit etre percu sans savoir lire : un son joue + le
// bouton flashe rouge brievement, puis revient a l'etat pret. Le clip audio
// est embarque dans l'app (assets/erreur.wav), donc disponible meme si le
// serveur ne repond plus du tout.
async function signalerErreur(texteJournal) {
  journal(texteJournal);
  if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
  etatBouton("erreur");
  try {
    const lecteur = $("lecteur");
    lecteur.src = "assets/erreur.wav";
    await new Promise((r) => { lecteur.onended = r; lecteur.play().catch(r); });
  } catch (e) { /* lecture best-effort : l'etat visuel suffit si le son echoue aussi */ }
  etatBouton("");
}

// 5 appuis rapides dans le coin haut-gauche (zone invisible) = ouvrir le
// reglage (geste reserve a l'equipe, improbable pour une utilisatrice qui ne
// cherche pas a l'activer).
function gererTapLogo() {
  compteurTapLogo++;
  clearTimeout(minuteurTapLogo);
  minuteurTapLogo = setTimeout(() => { compteurTapLogo = 0; }, 1500);
  if (compteurTapLogo >= 5) {
    compteurTapLogo = 0;
    $("champJeton").value = jeton;
    $("vueReglage").classList.add("visible");
  }
}
function fermerReglage() { $("vueReglage").classList.remove("visible"); }
function enregistrerJeton() {
  jeton = $("champJeton").value.trim();
  localStorage.setItem("ngoni_jeton", jeton);
  fermerReglage();
  demarrer();
}

// Marge large : un /call_audio reel enchaine conversion ffmpeg + ASR + TTS
// (Space Gradio distant), et le tout premier appel apres un redemarrage
// serveur sans prechauffage (NGONI_PREWARM, api.py) peut a lui seul prendre
// plusieurs secondes rien que pour charger le modele NeMo. Observe en test
// reel (2026-10-08) : 25s coupait avant que la vraie reponse n'arrive.
const DELAI_MAX_MS = 45000;

async function appelApi(chemin, options = {}) {
  const entetes = options.entetes || {};
  if (!(options.corps instanceof FormData)) entetes["Content-Type"] = "application/json";
  entetes["Authorization"] = "Bearer " + jeton;
  const controleur = new AbortController();
  const minuteur = setTimeout(() => controleur.abort(), DELAI_MAX_MS);
  let reponse;
  try {
    reponse = await fetch(chemin, {
      method: options.methode || "GET", headers: entetes,
      body: options.corps instanceof FormData ? options.corps : options.corps ? JSON.stringify(options.corps) : undefined,
      signal: controleur.signal,
    });
  } catch (e) {
    if (e.name === "AbortError") throw new Error("reseau trop lent, reessaie");
    throw e;
  } finally {
    clearTimeout(minuteur);
  }
  if (!reponse.ok) throw new Error(`${reponse.status} : ${await reponse.text()}`);
  return reponse.json();
}

function activerControles(actif) {
  $("bouton").disabled = !actif;
  document.querySelectorAll("#menuNumerique button, #champSaisie button, #choixOuiNon button")
    .forEach((b) => { b.disabled = !actif; });
}

// MODE TEST : quel widget de saisie proposer selon "attente" (voir
// agent_vocal.AgentVocal._attente) - clavier numerique pour quantite/montant,
// texte libre pour article/client, sinon un simple choix oui/non.
const LABELS_CHAMP = {
  quantite: { type: "number", inputmode: "numeric", placeholder: "Hakɛ (quantité)" },
  montant_fcfa: { type: "number", inputmode: "numeric", placeholder: "Wari hakɛ (montant)" },
  article: { type: "text", inputmode: "text", placeholder: "Fɛn tɔgɔ (article)" },
  client: { type: "text", inputmode: "text", placeholder: "Mɔgɔ tɔgɔ (client)" },
};

function appliquerAttente(attente) {
  $("menuNumerique").style.display = "none";
  $("champSaisie").style.display = "none";
  $("choixOuiNon").style.display = "none";

  if (!attente || attente === "menu") {
    $("menuNumerique").style.display = "flex";
    return;
  }
  if (attente.startsWith("champ:")) {
    const champ = attente.split(":")[1];
    const config = LABELS_CHAMP[champ] || { type: "text", inputmode: "text", placeholder: champ };
    const entree = $("champSaisieEntree");
    entree.type = config.type;
    entree.inputMode = config.inputmode;
    entree.placeholder = config.placeholder;
    entree.value = "";
    $("champSaisie").style.display = "flex";
    return;
  }
  // "confirmation_champ:...", "confirmation", "continuer" : oui/non.
  $("choixOuiNon").style.display = "flex";
}

async function demarrer() {
  if (!jeton) { journal("Aucun jeton enregistre."); return; }
  try {
    const bootstrap = await appelApi("/demo/bootstrap", { methode: "POST", corps: {} });
    utilisatriceId = bootstrap.utilisatrice_id;
    await nouvelleSession();
    journal("Pret.");
    activerControles(true);
  } catch (e) {
    await signalerErreur("Erreur de connexion : " + e.message);
  }
}

// Message d'accueil + menu numérique (menu_principal, messages_bambara.py) :
// joué automatiquement à chaque nouvelle session (démarrage de l'app, ou
// reprise après "fin_session"/"escalade_humaine" dans traiterReponseAgent),
// pour que l'utilisatrice sache quoi dire/taper sans avoir à deviner.
async function nouvelleSession() {
  const s = await appelApi("/session", { methode: "POST", corps: { utilisatrice_id: utilisatriceId } });
  sessionId = s.session_id;
  journal("Session " + sessionId + " demarree.");
  ajouterAuFil("N'GONI NANA", s.message);
  appliquerAttente(s.attente);
  if (s.audio_base64) {
    const lecteur = $("lecteur");
    lecteur.src = `data:audio/${s.type_audio};base64,${s.audio_base64}`;
    etatBouton("parle");
    await new Promise((r) => { lecteur.onended = r; lecteur.play().catch(r); });
    etatBouton("");
  }
}

async function commencerEnregistrement() {
  if (!media) media = await navigator.mediaDevices.getUserMedia({ audio: true });
  morceaux = [];
  enregistreur = new MediaRecorder(media);
  enregistreur.ondataavailable = (e) => morceaux.push(e.data);
  enregistreur.start();
  if (navigator.vibrate) navigator.vibrate(30);
  etatBouton("enregistre");
}

function arreterEnregistrement() {
  return new Promise((resoudre) => {
    if (!enregistreur || enregistreur.state === "inactive") return resoudre(null);
    enregistreur.onstop = () => resoudre(new Blob(morceaux, { type: "audio/webm" }));
    enregistreur.stop();
  });
}

// Partagé entre le tour vocal (/call_audio) et un choix de menu tapé (/call,
// voir envoyerChoixMenu) : même traitement de la réponse quel que soit le
// canal d'entrée, pour ne pas dupliquer la logique de lecture audio / fin de
// session entre les deux chemins.
async function traiterReponseAgent(resultat, texteEnvoye) {
  journal(`reconnu: « ${resultat.texte_reconnu ?? texteEnvoye ?? "(rien)"} » -> ${resultat.message}`);
  ajouterAuFil("Toi", resultat.texte_reconnu ?? texteEnvoye ?? "(rien compris)");  // MODE TEST, voir #filEchanges
  ajouterAuFil("N'GONI NANA", resultat.message);                                  // MODE TEST, voir #filEchanges
  appliquerAttente(resultat.attente);

  if (resultat.audio_base64) {
    const lecteur = $("lecteur");
    lecteur.src = `data:audio/${resultat.type_audio};base64,${resultat.audio_base64}`;
    etatBouton("parle");
    await new Promise((r) => { lecteur.onended = r; lecteur.play().catch(r); });
  }

  if (resultat.action === "fin_session" || resultat.action === "escalade_humaine") {
    // "enregistrer" ne declenche plus une nouvelle session tout de suite :
    // le systeme demande d'abord "veux-tu faire autre chose ?" et attend
    // une vraie reponse (voir agent_vocal.py, _traiter_reponse_continuer).
    // Une nouvelle session ne demarre qu'une fois cet echange termine
    // (oui -> "continuer_session" reste sur la meme session ; non ->
    // "fin_session" ici). Avant ce correctif, la session changeait tout de
    // suite apres l'enregistrement et la reponse a la question etait
    // traitee comme une tentative d'action ratee (bug reel, 2026-10-09).
    await nouvelleSession();
  }
}

async function envoyerTour(blobAudio) {
  etatBouton("traitement");
  activerControles(false);
  try {
    const donnees = new FormData();
    donnees.append("session_id", sessionId);
    donnees.append("utilisatrice_id", utilisatriceId);
    donnees.append("fichier", blobAudio, "tour.webm");
    const resultat = await appelApi("/call_audio", { methode: "POST", corps: donnees });
    await traiterReponseAgent(resultat);
  } catch (e) {
    await signalerErreur("Erreur : " + e.message);
  } finally {
    etatBouton("");
    activerControles(true);
  }
}

// MODE TEST : chemin texte partagé par le menu numérique, la saisie clavier
// d'un champ, et le choix oui/non - tous passent par /call, seul le texte
// envoyé change (voir reconnaitre_choix_menu, dictionnaire_mots_cles.py,
// pour le menu ; reconnaitre_confirmation pour le oui/non).
async function envoyerTexteLibre(texte) {
  etatBouton("traitement");
  activerControles(false);
  try {
    const resultat = await appelApi("/call", {
      methode: "POST",
      corps: { session_id: sessionId, utilisatrice_id: utilisatriceId, texte: String(texte) },
    });
    await traiterReponseAgent(resultat, String(texte));
  } catch (e) {
    await signalerErreur("Erreur : " + e.message);
  } finally {
    etatBouton("");
    activerControles(true);
  }
}

async function envoyerChoixMenu(chiffre) { await envoyerTexteLibre(chiffre); }

// MODE TEST : saisie clavier d'un champ precis (quantite/montant/article/
// client) - voir #champSaisie et appliquerAttente.
async function envoyerChampSaisi() {
  const valeur = $("champSaisieEntree").value.trim();
  if (!valeur) return;
  await envoyerTexteLibre(valeur);
}

// MODE TEST : confirmation unitaire d'un champ, confirmation globale, ou
// "veux-tu faire autre chose ?" - voir #choixOuiNon et appliquerAttente.
async function envoyerOuiNon(reponse) {
  await envoyerTexteLibre(reponse ? "owo" : "ayi");
}

// --- Bilan/résumé (demande explicite, en plus du flux vocal) ---

function construireLigne(gauche, droite, classeDroite) {
  const ligne = document.createElement("div");
  ligne.className = "ligne";
  const spanGauche = document.createElement("span");
  spanGauche.textContent = gauche;
  const spanDroite = document.createElement("span");
  if (classeDroite) spanDroite.className = classeDroite;
  spanDroite.textContent = droite;
  ligne.appendChild(spanGauche);
  ligne.appendChild(spanDroite);
  return ligne;
}

function remplirListe(conteneurId, items, construireItem) {
  const conteneur = $(conteneurId);
  conteneur.innerHTML = "";
  if (!items.length) {
    conteneur.appendChild(construireLigne("—", ""));
    return;
  }
  items.forEach((item) => conteneur.appendChild(construireItem(item)));
}

async function ouvrirBilan() {
  if (!utilisatriceId) return;
  try {
    const bilan = await appelApi(`/bilan/${utilisatriceId}`, { methode: "GET" });
    $("bilanCapital").textContent = bilan.capital.toLocaleString("fr-FR") + " FCFA";
    $("bilanCapital").classList.toggle("negatif", bilan.capital < 0);
    $("bilanVentes").textContent = "+" + bilan.total_ventes.toLocaleString("fr-FR");
    $("bilanDepenses").textContent = "-" + bilan.total_depenses.toLocaleString("fr-FR");

    remplirListe("bilanDettes", bilan.dettes_clients,
      (d) => construireLigne(d.nom, d.montant_du.toLocaleString("fr-FR")));
    $("bilanDettesCarte").style.display = bilan.dettes_clients.length ? "block" : "none";

    remplirListe("bilanStock", bilan.stock,
      (s) => construireLigne(s.article, String(s.quantite)));
    $("bilanStockCarte").style.display = bilan.stock.length ? "block" : "none";

    remplirListe("bilanTransactions", bilan.transactions, (t) => {
      const texte = [t.article, t.quantite].filter(Boolean).join(" x") || t.type;
      return construireLigne(texte, t.montant_fcfa.toLocaleString("fr-FR"), t.type === "vente" ? "vente" : "depense");
    });

    $("vueBilan").classList.add("visible");
  } catch (e) {
    await signalerErreur("Bilan indisponible : " + e.message);
  }
}
function fermerBilanVue() { $("vueBilan").classList.remove("visible"); }

const bouton = $("bouton");
let enTraitement = false;
bouton.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  // L'attribut HTML "disabled" n'empeche pas toujours un pointerdown de se
  // declencher (observe en test reel, 2026-10-08 : bouton grise car demarrer()
  // n'avait pas encore reussi, mais le micro s'activait quand meme et l'envoi
  // echouait en 401 plus loin, au lieu de simplement ne rien faire).
  if (bouton.disabled || enTraitement) return;
  commencerEnregistrement().catch((err) => signalerErreur("Micro indisponible : " + err.message));
});
["pointerup", "pointerleave", "pointercancel"].forEach((evt) =>
  bouton.addEventListener(evt, async () => {
    if (!enregistreur || enregistreur.state !== "recording") return;
    // Desactive IMMEDIATEMENT, avant tout await : sinon un second
    // pointerdown entre ce relachement et l'envoi reel peut demarrer un
    // nouvel enregistrement qui ecrase `morceaux` en plein milieu.
    enTraitement = true;
    $("bouton").disabled = true;
    const blob = await arreterEnregistrement();
    if (blob && blob.size > 0) {
      await envoyerTour(blob);
    } else {
      etatBouton("");
      $("bouton").disabled = false;
    }
    enTraitement = false;
  })
);

if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  journal("Microphone indisponible (ouvrir cette page en https).");
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

if (jeton) demarrer();
else journal("Aucun jeton : ouvrir le reglage (5 appuis coin haut-gauche de l'ecran).");
</script>
