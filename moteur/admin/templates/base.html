<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titre %}N'GONI NANA — Dashboard ABIC{% endblock %}</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --border: #dedee3; --text: #1c1c21;
    --text-soft: #6e7380; --accent: #b85424; --nav-active-bg: #f2e0cc;
    --ok-bg: #d9f2d9; --ok-text: #1f6b1f; --pending-bg: #fde9da; --pending-text: #9a5214;
    --off-bg: #eeeeee; --recette: #6b9e6b; --depense: #b85424;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  header.entete {
    display: flex; align-items: center; gap: 24px; padding: 16px 32px;
    background: var(--card); border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .marque h1 { font-size: 18px; margin: 0; }
  .marque p { font-size: 12px; color: var(--text-soft); margin: 2px 0 0; }
  nav.onglets { display: flex; gap: 4px; }
  nav.onglets a {
    padding: 6px 12px; border-radius: 6px; text-decoration: none; color: var(--text-soft);
    font-size: 13px; font-weight: 500;
  }
  nav.onglets a.actif { background: var(--nav-active-bg); color: var(--accent); font-weight: 700; }
  .utilisatrice-courante { margin-left: auto; font-size: 13px; color: var(--text-soft); }

  main { padding: 32px; max-width: 1200px; margin: 0 auto; }

  .cartes-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .carte {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px;
  }
  .carte .libelle { font-size: 12px; color: var(--text-soft); margin: 0 0 6px; }
  .carte .valeur { font-size: 24px; font-weight: 700; margin: 0; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--text-soft); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }

  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.ok { background: var(--ok-bg); color: var(--ok-text); }
  .badge.pending { background: var(--pending-bg); color: var(--pending-text); }
  .badge.off { background: var(--off-bg); color: var(--text-soft); }

  form.filtres { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  form.filtres select, form.filtres input[type=text] {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: var(--card);
  }
  form.filtres button, a.bouton {
    padding: 7px 14px; border-radius: 6px; border: none; background: var(--accent); color: #fff;
    font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block;
  }

  .barre-coop { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .barre-coop .piste { flex: 1; height: 8px; background: var(--off-bg); border-radius: 4px; overflow: hidden; }
  .barre-coop .remplissage { height: 100%; background: var(--accent); }

  .section-titre { font-size: 15px; font-weight: 700; margin: 0 0 12px; }
</style>
</head>
<body>
<header class="entete">
  <div class="marque">
    <h1>N'GONI NANA</h1>
    <p>Dashboard ABIC — module Comptabilité GERME</p>
  </div>
  <nav class="onglets">
    <a href="/admin/" class="{{ 'actif' if page == 'vue_ensemble' else '' }}">Vue d'ensemble</a>
    <a href="/admin/utilisatrices" class="{{ 'actif' if page == 'utilisatrices' else '' }}">Utilisatrices</a>
    <a href="/admin/sessions" class="{{ 'actif' if page == 'sessions' else '' }}">Sessions</a>
    <a href="/admin/rapports" class="{{ 'actif' if page == 'rapports' else '' }}">Rapports</a>
  </nav>
  <span class="utilisatrice-courante">Administratrice ABIC</span>
</header>
<main>
{% block contenu %}{% endblock %}
</main>
</body>
</html>
